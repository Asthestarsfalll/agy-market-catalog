name: Sync Releases & Dual Mirror Publish (Every 30m)

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'data/plugins/**'
      - 'state/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: catalog-state-publish
  cancel-in-progress: false

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Seed existing per-plugin READMEs from gh-pages
        run: |
          mkdir -p .tmp/gh-pages-seed/readmes
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            git archive origin/gh-pages -- readmes 2>/dev/null | tar -x -C .tmp/gh-pages-seed || true
          fi

      - name: "Poll GitHub Releases & build static catalog"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-releases.mjs
          node scripts/build-catalog.mjs --seed-readmes-dir=.tmp/gh-pages-seed/readmes --gc-icons
          node scripts/sync-readme-tables.mjs --write

      - name: "Commit updated lock/ledger state and README tables to main (with rebase retry)"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          [ -f README.md ] && git add README.md || true
          [ -f README.en.md ] && git add README.en.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): update versions-lock and ledger"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to push synced state to main after 3 attempts"
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi

      - name: Publish dist/* to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .tmp/gh-pages
          cp -r dist/* .tmp/gh-pages/
          touch .tmp/gh-pages/.nojekyll
          cd .tmp/gh-pages
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(catalog): publish compiled catalog artifacts"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Publish @agy-market/catalog to npm via OIDC on content change
        if: ${{ env.NPM_PUBLISH_ENABLED == 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-catalog-npm.mjs

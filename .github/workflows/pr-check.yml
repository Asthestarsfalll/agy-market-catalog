name: Tier 1 — PR Entry Validation (Zero Secrets)

on:
  pull_request:
    paths:
      - 'data/plugins/**'
      - 'scripts/**'
      - 'schemas/**'
      - 'test/**'

permissions:
  contents: read

jobs:
  lint-entries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "Enforce PR file path & count guardrails"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          git diff --name-status "$MERGE_BASE" "$HEAD_SHA" | node scripts/admit-pr-helper.mjs parse-diff

      - name: "Validate submission YAML schemas & run unit tests"
        run: |
          node scripts/validate-entries.mjs
          node --test test/*.test.mjs
